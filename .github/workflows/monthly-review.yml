name: Monthly data review

# Opens a GitHub issue on the 1st of each month listing what last month's headlines suggest needs
# changing in the workbook, plus rows going stale and regulatory dates that have passed.
# It reads data and writes a brief. It never edits the database.

on:
  schedule:
    - cron: "0 22 1 * *"      # 22:00 UTC on the 1st = 09:00 AEDT / 08:00 AEST
  workflow_dispatch:
    inputs:
      since:
        description: "Start date (YYYY-MM-DD). Blank = start of last month."
        required: false
      until:
        description: "End date, exclusive (YYYY-MM-DD). Blank = start of this month."
        required: false

permissions:
  contents: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Locate project root
        id: root
        run: |
          DIR=""
          if [ -f scripts/monthly_review.py ]; then
            DIR="."
          else
            for d in */; do
              if [ -f "${d}scripts/monthly_review.py" ]; then DIR="${d%/}"; break; fi
            done
          fi
          if [ -z "$DIR" ]; then
            echo "::error::Could not find scripts/monthly_review.py anywhere in the repository."
            ls -la; exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.root.outputs.dir }}
        run: pip install -r scripts/requirements.txt

      - name: Rebuild data so the review sees the current database
        working-directory: ${{ steps.root.outputs.dir }}
        run: python scripts/build_data.py

      - name: Generate the review brief
        id: brief
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          MONTH=$(date -u -d "last month" +%Y-%m)
          ARGS=""
          [ -n "${{ inputs.since }}" ] && ARGS="$ARGS --since ${{ inputs.since }}"
          [ -n "${{ inputs.until }}" ] && ARGS="$ARGS --until ${{ inputs.until }}"
          mkdir -p review
          python scripts/monthly_review.py $ARGS --out "review/${MONTH}.md" --json "review/${MONTH}.json"
          cp "review/${MONTH}.md" review/latest.md
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "path=${{ steps.root.outputs.dir }}/review/${MONTH}.md" >> "$GITHUB_OUTPUT"

      - name: Keep the brief in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.root.outputs.dir }}/review" || true
          if git diff --cached --quiet; then
            echo "No review changes"
          else
            git commit -m "chore(review): monthly brief ${{ steps.brief.outputs.month }} [skip ci]"
            git push
          fi

      # GitHub refuses an issue body over 65,536 characters. A busy news month can produce a brief
      # larger than that, so the issue carries a trimmed copy and always links to the complete file,
      # which the step above has just committed.
      - name: Open the review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIEF_PATH: ${{ steps.brief.outputs.path }}
          BRIEF_MONTH: ${{ steps.brief.outputs.month }}
        run: |
          gh label create data-review --color 0E8A16 --description "Monthly workbook review queue" 2>/dev/null || true

          python - <<'PY'
          import os

          LIMIT = 60000                       # GitHub's hard ceiling is 65,536 characters
          src   = os.environ["BRIEF_PATH"]
          path  = src.removeprefix("./")
          url   = "{}/{}/blob/main/{}".format(
              os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], path)

          text   = open(src, encoding="utf-8").read()
          header = "Full brief, always complete: [`{}`]({})\n\n".format(path, url)
          body   = header + text

          if len(body) > LIMIT or len(body.encode("utf-8")) > LIMIT:
              note = ("\n\n---\n\n*Trimmed to fit GitHub's issue size limit. "
                      "The rest of this month's queue is in the file linked at the top.*\n")
              room = LIMIT - len(note)
              cut  = body[:room]
              if len(cut.encode("utf-8")) > room:           # keeps CJK-heavy briefs safe too
                  cut = cut.encode("utf-8")[:room].decode("utf-8", "ignore")
              cut  = cut[: cut.rfind("\n")]
              body = cut + note

          with open("issue-body.md", "w", encoding="utf-8") as fh:
              fh.write(body)
          print("issue body: {} characters (brief was {})".format(len(body), len(text)))
          PY

          gh issue create \
            --title "Monthly data review — ${BRIEF_MONTH}" \
            --body-file issue-body.md \
            --label data-review
